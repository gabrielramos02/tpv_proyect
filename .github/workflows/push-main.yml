name: Nightly Build & Release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=${{ env.JAVA_HOME }}" >> $GITHUB_ENV

      - name: Decode keystore
        run: |
          echo "${{ secrets.UPLOAD_KEY_JKS }}" | base64 -d -i > android/app/upload.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEY_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload.jks
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload to public repo
        run: |
          mkdir -p build_output
          for f in build/app/outputs/flutter-apk/*.apk; do
            base=$(basename "$f" .apk)
            cp "$f" "build_output/${base}-$(date +%Y%m%d-%H%M).apk"
          done
      - name: Generate release tag
        id: release_tag
        run: |
          TAG="nightly-$(date +%Y%m%d-%H%M)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=Nightly Build $(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Create tag in releases repo
        run: |
          git clone https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/gabrielramos02/tpv_release.git releases_repo
          cd releases_repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.release_tag.outputs.tag }}
          git push origin ${{ steps.release_tag.outputs.tag }}

      - name: Create GitHub Release in releases repo
        uses: softprops/action-gh-release@v1
        with:
          files: build_output/*.apk
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.name }}
          body: Automated nightly build release
          draft: false
          prerelease: true
          repository: gabrielramos02/tpv_release
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}

name: Nightly Build & Release

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check for new commits
        id: check_commits
        run: |
          LAST_BUILD=$(git describe --tags --abbrev=0 2>/dev/null || echo "1970-01-01")
          COMMITS=$(git log --oneline --since="$LAST_BUILD" | wc -l)
          echo "new_commits=$COMMITS" >> $GITHUB_OUTPUT
      - name: Setup Flutter
        if: steps.check_commits.outputs.new_commits > 0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=${{ env.JAVA_HOME }}" >> $GITHUB_ENV

      - name: Get dependencies
        if: steps.check_commits.outputs.new_commits > 0
        run: flutter pub get

      - name: Build release APK
        if: steps.check_commits.outputs.new_commits > 0
        run: flutter build apk --release --split-per-abi

      - name: Upload to public repo
        if: steps.check_commits.outputs.new_commits > 0
        run: |
          mkdir -p build_output
          for f in build/app/outputs/flutter-apk/*.apk; do
            base=$(basename "$f" .apk)
            cp "$f" "build_output/${base}-$(date +%Y%m%d-%H%M).apk"
          done
      - name: Generate release tag
        if: steps.check_commits.outputs.new_commits > 0
        id: release_tag
        run: |
          TAG="nightly-$(date +%Y%m%d-%H%M)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=Nightly Build $(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Create tag in releases repo
        if: steps.check_commits.outputs.new_commits > 0
        run: |
          git clone https://x-access-token:${{ secrets.RELEASES_REPO_TOKEN }}@github.com/<owner>/<releases-repo>.git releases_repo
          cd releases_repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.release_tag.outputs.tag }}
          git push origin ${{ steps.release_tag.outputs.tag }}

      - name: Create GitHub Release
        if: steps.check_commits.outputs.new_commits > 0
        uses: softprops/action-gh-release@v1
        with:
          files: build_output/*.apk
          tag_name: nightly-$(date +%Y%m%d-%H%M)
          name: Nightly Build $(date +%Y-%m-%d)
          body: Automated nightly build release
          draft: false
          prerelease: true
          repository: gabrielramos02/tpv_release
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN}}
